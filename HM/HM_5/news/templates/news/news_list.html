<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новости</title>
</head>
<body>

    <h1>Последние новости</h1>
    {% if perms.news.add_news %}
    <p>
        <a href="{% url 'news_create' %}">
            Добавить новость
        </a>
    </p>
{% endif %}

    {% for item in news %}

        <article>
            <h2>
                <a href="{% url 'news_detail' item.slug %}">
                    {{ item.title }}
                </a>
            </h2>

            <p>{{ item.category.name }}</p>

            <p>{{ item.content|truncatewords:20 }}</p>

            <small>
                Автор: {{ item.author.username }}
            </small>

            <hr>
        </article>

    {% empty %}

        <p>Новостей пока нет.</p>

    {% endfor %}

</body>
</html>
