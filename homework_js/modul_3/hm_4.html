<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Светофор с кнопкой</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2ece4; 
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            align-items: center;
            gap: 20px; 
        }

        .traffic-light {
            display: flex;
            gap: 20px;
            padding: 20px 30px;
            background-color: #fdf8f2;
            border: 3px solid #8c8c8c; 
            border-radius: 20px; 
        }

        .light {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #8c8c8c; 
            transition: background-color 0.3s ease;
        }

        .light.red.active {
            background-color: #e53935; 
        }

        .light.yellow.active {
            background-color: #ff9900;
        }

        .light.green.active {
            background-color: #43a047;
        }

        #next-btn {
            padding: 40px 20px; 
            font-size: 28px;
            background-color: #e0e0e0;
            border: 2px solid #b0b0b0;
            border-radius: 15px; 
            cursor: pointer;
            font-weight: 500;
            color: #000;
            transition: background-color 0.2s, transform 0.1s;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #next-btn:hover {
            background-color: #d0d0d0;
        }

        #next-btn:active {
            transform: scale(0.98);
            background-color: #c0c0c0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="traffic-light">
            <div class="light red" id="red-light"></div>
            <div class="light yellow active" id="yellow-light"></div>
            <div class="light green" id="green-light"></div>
        </div>

        <button id="next-btn">NEXT</button>
    </div>

    <script>
        const redLight = document.getElementById('red-light');
        const yellowLight = document.getElementById('yellow-light');
        const greenLight = document.getElementById('green-light');
        const nextBtn = document.getElementById('next-btn');

        const lights = [redLight, yellowLight, greenLight];

        let currentLightIndex = 1;

        function updateTrafficLight() {
            lights.forEach(light => {
                light.classList.remove('active');
            });

            lights[currentLightIndex].classList.add('active');
        }

        nextBtn.addEventListener('click', () => {
            currentLightIndex = (currentLightIndex + 1) % 3;

            updateTrafficLight();
        });
    </script>

</body>
</html>
