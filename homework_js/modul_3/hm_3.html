<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Футбольное поле с мячом</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #field {
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                90deg,
                #2e7d32,
                #2e7d32 50px,
                #388e3c 50px,
                #388e3c 100px
            );
            position: relative;
            box-sizing: border-box;
            border: 4px solid white;
            cursor: crosshair;
        }

        #field::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            border: 4px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #field::after {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 4px;
            height: 100%;
            background-color: white;
            transform: translateX(-50%);
            pointer-events: none;
        }

        #ball {
            width: 100px;
            height: 100px;
            position: absolute;
            left: calc(50% - 50px);
            top: calc(50% - 50px);
            transition: left 0.5s cubic-bezier(0.25, 1, 0.5, 1), 
                        top 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none; 
            user-select: none;
            z-index: 10;
        }

        .penalty-area {
            position: absolute;
            top: 50%;
            width: 150px;
            height: 400px;
            border: 4px solid white;
            transform: translateY(-50%);
            pointer-events: none;
        }
        .penalty-area.left {
            left: 0;
            border-left: none;
        }
        .penalty-area.right {
            right: 0;
            border-right: none;
        }
    </style>
</head>
<body>


    <div id="field">
        <div class="penalty-area left"></div>
        <div class="penalty-area right"></div>
        
        <img id="ball" src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Soccerball.svg" alt="Футбольный мяч">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const field = document.getElementById('field');
            const ball = document.getElementById('ball');
            const BALL_SIZE = 100;

            field.addEventListener('click', (event) => {

                const clickX = event.clientX;
                const clickY = event.clientY;

                let targetX = clickX - (BALL_SIZE / 2);
                let targetY = clickY - (BALL_SIZE / 2);

                const fieldWidth = field.clientWidth;
                const fieldHeight = field.clientHeight;


                if (targetX < 0) {
                    targetX = 0;
                }

                if (targetX > fieldWidth - BALL_SIZE) {
                    targetX = fieldWidth - BALL_SIZE;
                }

                if (targetY < 0) {
                    targetY = 0;
                }
                if (targetY > fieldHeight - BALL_SIZE) {
                    targetY = fieldHeight - BALL_SIZE;
                }

                ball.style.left = targetX + 'px';
                ball.style.top = targetY + 'px';
            });
        });
    </script>

</body>
</html>
