<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Форма пользователя</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }

        form {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select, textarea {
            padding: 8px;
            font-size: 16px;            
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            background-color: #0056b3;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #004494;
        }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<h2>Форма пользователя</h2>

<form class="user-form">
    <input type="text" name="name" class="name-input" placeholder="Введите имя">

    <input type="email" name="email" class="email-input" placeholder="Введите email" required>

    <select name="country" class="country-select">
        <option disabled selected>Выберите страну:</option>
        <option value="Россия">Россия</option>
        <option value="Казахстан">Казахстан</option>
        <option value="Беларусь">Беларусь</option>
    </select>

    <textarea name="comment" class="comment-textarea" placeholder="Комментарий"></textarea>

    <button type="submit">Отправить</button>
</form>

<script>
const form = document.querySelector(".user-form");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.querySelector(".name-input").value.trim();
    const email = document.querySelector(".email-input").value.trim();

    if (name === "") {
        alert("Введите имя!");
        return;
    }

    if (email === "") {
        alert("Введите email!");
        return;
    }

    const formData = new FormData(form);

    try {
        const response = await fetch("https://jsonplaceholder.typicode.com/posts", {
            method: "POST",
            body: formData
        });

        if (response.ok) {
            alert("Данные успешно отправлены!");
            form.reset();
        } else {
            alert("Ошибка при отправке.");
        }

    } catch (error) {
        alert("Ошибка соединения с сервером.");
    }
});
</script>

</body>
</html>
