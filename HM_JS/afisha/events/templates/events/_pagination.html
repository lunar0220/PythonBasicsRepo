{% if is_paginated %}
<div class="pagination">
  {% if page_obj.has_previous %}<a href="?{% if q %}q={{ q|urlencode }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Назад</a>{% endif %}
  <span>Страница {{ page_obj.number }} из {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?{% if q %}q={{ q|urlencode }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Вперёд →</a>{% endif %}
</div>
{% endif %}
