{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Афиша мероприятий{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 16px; color: #222; }
    nav { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid #ddd; padding-bottom: 12px; margin-bottom: 20px; }
    nav form { margin-left: auto; display: flex; gap: 6px; }
    a { color: #2563eb; text-decoration: none; } a:hover { text-decoration: underline; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; }
    .card h3 { margin: 0 0 6px; }
    .meta { color: #666; font-size: 14px; }
    .badge { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 12px; padding: 2px 10px; font-size: 13px; margin-right: 4px; }
    .off { color: #b91c1c; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px; text-align: left; }
    .pagination { display: flex; gap: 12px; margin: 20px 0; }
  </style>
</head>
<body>
  <nav>
    <strong>Афиша</strong>
    <a href="{% url 'event_list' %}">Главная</a>
    <a href="{% url 'statistics' %}">Статистика</a>
    <a href="{% url 'event_search' %}">Поиск</a>
    <form action="{% url 'event_search' %}" method="get">
      <input type="search" name="q" value="{{ q|default:'' }}" placeholder="Поиск мероприятий">
      <button type="submit">Найти</button>
    </form>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
